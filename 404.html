<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050810" />
    <title>404 · Señal perdida · Saúl Martín Sánchez</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      @font-face {
        font-family: "Barlow Condensed";
        src: url("/fonts/BarlowCondensed-ExtraBoldItalic.woff2") format("woff2");
        font-weight: 800;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: "Space Grotesk";
        src: url("/fonts/SpaceGrotesk-Variable.woff2") format("woff2");
        font-weight: 300 700;
        font-display: swap;
      }
      :root {
        --bg: #050810;
        --acid: #f1ff28;
        --signal: #34edff;
        --pink: #ff468c;
        --muted: #a7b8c9;
        --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: #f1f4f1;
        font-family: "Space Grotesk", Arial, sans-serif;
        overflow: hidden;
      }
      .bg {
        position: fixed;
        inset: 0;
        background: url("/images/backgrounds/after-hours-city.webp") center /
          cover;
        opacity: 0.28;
        filter: saturate(1.2) hue-rotate(-10deg);
      }
      .bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          repeating-linear-gradient(0deg, #ffffff07 0 1px, transparent 1px 3px),
          radial-gradient(circle at 50% 50%, transparent 0, #050810 75%);
      }
      main {
        position: relative;
        padding: 32px 24px;
        max-width: 760px;
        text-align: left;
      }
      .kicker {
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 4px;
        color: var(--pink);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .kicker i {
        width: 8px;
        height: 8px;
        background: var(--pink);
        animation: blink 1s steps(1) infinite;
      }
      h1 {
        position: relative;
        margin: 18px 0 0;
        font-family: "Barlow Condensed", "Arial Black", sans-serif;
        font-style: italic;
        font-weight: 800;
        font-size: clamp(120px, 30vw, 260px);
        line-height: 0.8;
        color: var(--acid);
      }
      h1::before,
      h1::after {
        content: attr(data-text);
        position: absolute;
        inset: 0;
        opacity: 0;
      }
      h1::before {
        color: var(--signal);
        transform: translate(-4px, 0);
        clip-path: inset(10% 0 60% 0);
        animation: glitch 2.6s infinite steps(2);
      }
      h1::after {
        color: var(--pink);
        transform: translate(4px, 0);
        clip-path: inset(60% 0 8% 0);
        animation: glitch 3.1s infinite steps(2) reverse;
      }
      h2 {
        margin: 18px 0 0;
        font-family: "Barlow Condensed", "Arial Black", sans-serif;
        font-style: italic;
        font-weight: 800;
        font-size: clamp(34px, 7vw, 56px);
        text-transform: uppercase;
        line-height: 0.95;
      }
      pre {
        margin: 26px 0 0;
        padding: 16px 18px;
        border: 1px solid #34edff40;
        border-left: 3px solid var(--signal);
        background: #03060ee0;
        font-family: var(--mono);
        font-size: 13px;
        line-height: 1.7;
        color: var(--muted);
        white-space: pre-wrap;
      }
      pre b {
        color: var(--pink);
        font-weight: 400;
      }
      pre em {
        color: #5dff9b;
        font-style: normal;
      }
      .actions {
        margin-top: 28px;
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        align-items: center;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 16px 22px;
        background: var(--acid);
        color: #050810;
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 2px;
        text-decoration: none;
        clip-path: polygon(0 0, 92% 0, 100% 30%, 100% 100%, 0 100%);
      }
      .btn:hover,
      .btn:focus-visible {
        background: #fff;
      }
      .alt {
        color: #f1f4f1;
        font-size: 15px;
        text-underline-offset: 6px;
        text-decoration-color: var(--signal);
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      @keyframes glitch {
        0%,
        84%,
        100% {
          opacity: 0;
        }
        86% {
          opacity: 0.85;
          clip-path: inset(12% 0 62% 0);
        }
        90% {
          opacity: 0.85;
          clip-path: inset(48% 0 30% 0);
        }
        94% {
          opacity: 0.85;
          clip-path: inset(72% 0 6% 0);
        }
        97% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        h1::before,
        h1::after,
        .kicker i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <main>
      <p class="kicker"><i aria-hidden="true"></i>ERROR // SEÑAL PERDIDA</p>
      <h1 data-text="404">404</h1>
      <h2>Esta ruta no existe<br />en mi red.</h2>
      <pre aria-label="Registro del error"><span id="req">GET /ruta-desconocida</span> HTTP/2
<b>404 Not Found</b> · paquete descartado por el firewall
traceroute → <em>saulmartin.com</em> ✔ (el inicio sigue online)</pre>
      <div class="actions">
        <a class="btn" href="/">&gt;_ VOLVER AL INICIO</a>
        <a class="alt" href="/#contact">¿Buscabas algo? Escríbeme →</a>
      </div>
    </main>
    <script>
      document.getElementById("req").textContent =
        "GET " + decodeURIComponent(location.pathname).slice(0, 60);
    </script>
  </body>
</html>
